[package]
name = "gh-auto-switcher"
version = "0.1.1"
edition = "2021"
rust-version = "1.93.1"
description = "Run GitHub CLI with the account selected by native Git configuration"
license = "MIT"

[[bin]]
name = "gh-auto-switcher"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
